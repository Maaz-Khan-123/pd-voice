# Streamlit theme for the voice research prototype (dark, one accent colour).
# Accent = aqua #00a888. Chart colours (healthy blue #338ced, Parkinson's orange
# #e76624, accent aqua) were checked together for colour-blind separation on this
# background with the dataviz palette validator.

[theme]
base = "dark"
primaryColor = "#00a888"
backgroundColor = "#131315"
secondaryBackgroundColor = "#1c1c20"
textColor = "#ececec"
borderColor = "#2c2c32"
showWidgetBorder = true
baseRadius = "8px"
# Inter is loaded in app.py's CSS; the system font is the fallback when offline.
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
